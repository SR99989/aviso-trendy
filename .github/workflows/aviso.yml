name: Aviso Trendy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Revisar la tienda
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_adviento.py ${{ inputs.prueba && '--prueba' || '--una-vez' }}

      - name: Guardar lo ya avisado
        run: |
          git config user.name "aviso-bot"
          git config user.email "aviso-bot@users.noreply.github.com"
          git add avisados.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado" && git push)
